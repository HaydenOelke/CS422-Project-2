services:
  flask:
    build: ./app
    ports:
      - "8080:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/mealtrack
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
    volumes:
      - ./app:/app
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:6
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    logging:
      driver: "none"

volumes:
  mongo_data:
