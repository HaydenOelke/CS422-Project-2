<!-- 
  Base Template - base.html
  
  Purpose: This HTML file provides a consistent base layout for all pages of the MeatTrack application. 
  All other HTML files extend this base template to maintain consistency and structure.
  The base template includes a navigation bar with links to the dashboard, browse meals, purchase history, and settings pages.
  
  Authors: Hayden Oelke
  
  Date Created: 5/21/2026
-->


<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MealTrack – {% block title %}{% endblock %}</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    nav {
      background: #1a3a2a;
      color: white;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      height: 52px;
    }

    nav .brand {
      font-weight: 700;
      font-size: 1.1rem;
    }

    nav a {
      color: rgba(255, 255, 255, .75);
      text-decoration: none;
      font-size: .9rem;
    }

    nav a:hover {
      color: white;
    }

    .container {
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1.25rem;
    }

    h1 {
      font-size: 1.5rem;
      color: #1a3a2a;
      margin-bottom: 1rem;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 1.5rem;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
      margin-bottom: 1.25rem;
    }

    p {
      color: #888;
      font-size: .95rem;
    }

    /* for meals.html */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .9rem;
    }

    th {
      text-align: left;
      padding: .5rem .75rem;
      border-bottom: 2px solid #eee;
      color: #555;
      font-weight: 600;
    }

    td {
      padding: .5rem .75rem;
      border-bottom: 1px solid #f0f0f0;
    }

    .btn {
      display: inline-block;
      padding: .45rem 1rem;
      border-radius: 6px;
      font-size: .875rem;
      cursor: pointer;
      border: none;
      text-decoration: none;
    }

    .btn-primary {
      background: #1a3a2a;
      color: white;
    }

    .btn-primary:hover {
      background: #245038;
    }

    .btn-sm {
      padding: .3rem .7rem;
      font-size: .8rem;
    }

    .flash {
      padding: .6rem 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: .875rem;
    }

    .flash.success {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .flash.error {
      background: #fdecea;
      color: #c0392b;
    }

    select,
    input[type=text],
    input[type=number] {
      padding: .4rem .7rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: .875rem;
      width: 100%;
      margin-bottom: .75rem;
    }

    label {
      font-size: .85rem;
      color: #444;
      display: block;
      margin-bottom: .25rem;
    }
  </style>
</head>

<body>
  <nav>
    <span class="brand">🍽 MealTrack</span>
    <a href="/">Dashboard</a>
    <a href="/meals">Browse Meals</a>
    <a href="/history">Purchase History</a>
    <a href="/settings">Settings</a>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>

</html>
